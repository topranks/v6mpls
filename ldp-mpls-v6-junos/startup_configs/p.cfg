chassis {
    fpc 0 {
        pic 0 {
            number-of-ports 12;
        }
    }
    network-services enhanced-ip;
}
interfaces {
    ge-0/0/0 {
        description "PE1:ge-0/0/1";
        mtu 9192;
        unit 0 {
            family iso;
            family inet6 {
                address 2001:db8:2::3/127;
            }
            family mpls;
        }
    }
    ge-0/0/1 {
        description "PE2:ge-0/0/1";
        mtu 9192;
        unit 0 {
            family iso;
            family inet6 {
                address 2001:db8:2::5/127;
            }
            family mpls;
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
            family inet6 {
                address 2001:db8::2/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family iso {
                address 49.0001.0000.0000.0000.0002.00;
            }
            family inet6 {
                address 2001:db8:10::2/128;
            }
        }
    }
}
routing-instances {
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    router-id 203.0.113.102;
    autonomous-system 64496;
}
protocols {
    isis {
        interface ge-0/0/0.0 {
            point-to-point;
            level 1 disable;
            level 2 metric 100;
        }
        interface ge-0/0/1.0 {
            point-to-point;
            level 1 disable;
            level 2 metric 100;
        }
        interface lo0.0 {
            passive;
            level 1 disable;
            level 2 metric 1;
        }
        level 1 disable;
        level 2 wide-metrics-only;
    }
    mpls {
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
    }
    ldp {
        transport-preference ipv6;
        explicit-null;
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
        interface lo0.0;
        family {
            inet6;
        }
    }
}
