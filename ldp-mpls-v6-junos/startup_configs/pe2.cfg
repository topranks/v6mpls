system {
    host-name pe2;
    root-authentication {
        encrypted-password "$6$yBy67qLH$NqW7S7TZuB/yZYvcNycVvg5smjOigkhToDo3rlNRoet825XoREIfoYAUVQkJFn27Q6PhpR/hKyyHeVBW5Ijat.";
    }
    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$V40zMuuU$peX1dTx9bF3N2jqP/BqYw9aRt8uYJGQLLOBGftCGmFOmCauO0Jg2.eg5eVemSR3wwo6h4qHWBRxfip13BOU7d0";
            }
        }
    }
    services {
        ssh {
            root-login allow;
        }
        netconf {
            ssh;
        }
    }
    management-instance;
}
chassis {
    fpc 0 {
        pic 0 {
            number-of-ports 12;
        }
    }
    network-services enhanced-ip;
}
interfaces {
    ge-0/0/0 {
        description "CE2:eth1";
        unit 0 {
            family inet {
                address 198.51.100.5/30;
            }
            family inet6 {
                address 2001:db8:50::4/127;
            }
        }
    }
    ge-0/0/1 {
        description "P:ge-0/0/1";
        mtu 9192;
        unit 0 {
            family inet;
            family iso;
            family inet6 {
                address 2001:db8:2::4/127;
            }
            family mpls;
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
            family inet6 {
                address 2001:db8::2/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family iso {
                address 49.0001.0000.0000.0000.0003.00;
            }
            family inet6 {
                address 2001:db8:10::3/128;
            }
        }
    }
}
policy-options {
    policy-statement NEXT-HOP-SELF {
        then {
            next-hop self;
        }
    }
}
routing-instances {
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    resolution {
        rib inet.0 {
            inet6-resolution-ribs inet6.3;
        }
    }
    router-id 203.0.113.103;
    autonomous-system 64496;
}
protocols {
    bgp {
        group IBGP {
            type internal;
            local-address 2001:db8:10::3;
            family inet {
                unicast {
                    extended-nexthop;
                }
            }
            family inet6 {
                unicast;
            }
            export NEXT-HOP-SELF;
            neighbor 2001:db8:10::1 {
                description PE1;
            }
        }
        group CE2-V4 {
            type external;
            family inet {
                unicast;
            }
            peer-as 64498;
            neighbor 198.51.100.6 {
                description CE2-v4;
            }
        }
        group CE2-V6 {
            type external;
            family inet6 {
                unicast;
            }
            peer-as 64498;
            neighbor 2001:db8:50::5 {
                description CE2-v6;
            }
        }
    }
    isis {
        interface ge-0/0/1.0 {
            point-to-point;
            level 1 disable;
            level 2 metric 100;
        }
        interface lo0.0 {
            passive;
            level 1 disable;
            level 2 metric 1;
        }
        level 1 disable;
        level 2 wide-metrics-only;
    }
    mpls {
        interface ge-0/0/1.0;
    }
    ldp {
        transport-preference ipv6;
        interface ge-0/0/1.0;
        interface lo0.0;
        family {
            inet6;
        }
    }
}
