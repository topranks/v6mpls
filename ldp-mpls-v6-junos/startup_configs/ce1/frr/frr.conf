!
frr version 7.5.1
frr defaults traditional
hostname ce1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
router bgp 64497
 neighbor 198.51.100.1 remote-as 64496
 neighbor 2001:db8:50::2 remote-as 64496
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 198.51.100.1 route-map ALLOW-ALL in
  neighbor 198.51.100.1 route-map LOOP4 out
  no neighbor 2001:db8:50::2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  neighbor 2001:db8:50::2 activate
  neighbor 2001:db8:50::2 route-map ALLOW-ALL in
  neighbor 2001:db8:50::2 route-map LOOP6 out
 exit-address-family
!
ip prefix-list LOOP4 seq 5 permit 203.0.113.0/24 ge 32 le 32
!
ipv6 prefix-list LOOP6 seq 5 permit 2001:db8::/32 ge 128 le 128
!
route-map ALLOW-ALL permit 100
!
route-map LOOP4 permit 100
 match ip address prefix-list LOOP4
!
route-map LOOP6 permit 100
 match ipv6 address prefix-list LOOP6
!
line vty
!
